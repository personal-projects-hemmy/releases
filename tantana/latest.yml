notes: "Fixes the signed-in drawer header (name and email no longer clipped). A gear opens General settings for Account / Sync, language, theme, fingerprint lock, and Check for a new APK. Sign out is at the bottom of the menu when you are signed in; local data stays on the phone. The Android back gesture now closes only the side menu, not the app. After you confirm your email, a successful sign-in no longer shows a generic error; first sync after switching accounts no longer reuses the previous account's cloud row IDs. If a confirmation email cannot be sent, the app now says so clearly."
notesFr: "L'en-tête du menu affiche le nom et l'e-mail sans les couper. L'icône d'engrenage ouvre Paramètres généraux (Compte / Sync, langue, thème, verrouillage par empreinte et Vérifier un nouvel APK). « Se déconnecter » est en bas du menu lorsque vous êtes connecté ; les données restent sur le téléphone. Le geste Retour ferme uniquement le menu latéral, pas l'application. Après confirmation de l'e-mail, une connexion réussie n'affiche plus une erreur générique ; la première sync après un changement de compte ne réutilise plus les identifiants cloud de l'ancien compte. Si l'e-mail de confirmation ne peut pas être envoyé, l'application l'indique clairement."
